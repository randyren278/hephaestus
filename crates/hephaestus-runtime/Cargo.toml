[package]
name = "hephaestus-runtime"
description = "Capability-scoped sandbox and provider-neutral runtime adapters"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true
publish = false

[features]
test-support = []

[dependencies]
blake3 = "1"
hephaestus-core = { path = "../hephaestus-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustix = { version = "0.38", features = ["process"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
