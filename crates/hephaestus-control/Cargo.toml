[package]
name = "hephaestus-control"
description = "Daemon-owned local control plane and operator CLI for Hephaestus"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
test-support = ["hephaestus-arena/test-support", "hephaestus-runtime/test-support"]

[dependencies]
blake3 = "1"
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
hephaestus-arena = { path = "../hephaestus-arena" }
hephaestus-core = { path = "../hephaestus-core" }
hephaestus-experience = { path = "../hephaestus-experience" }
hephaestus-genome = { path = "../hephaestus-genome" }
hephaestus-ledger = { path = "../hephaestus-ledger" }
hephaestus-runtime = { path = "../hephaestus-runtime" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[dev-dependencies]
hephaestus-arena = { path = "../hephaestus-arena", features = ["test-support"] }
hephaestus-runtime = { path = "../hephaestus-runtime", features = ["test-support"] }
rusqlite = "0.37"

[lints]
workspace = true
