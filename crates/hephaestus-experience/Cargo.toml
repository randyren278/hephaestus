[package]
name = "hephaestus-experience"
description = "Redacted execution traces and provenance-backed experience records"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true
publish = false

[dependencies]
blake3 = "1"
ed25519-dalek = { version = "2", default-features = false, features = ["std", "zeroize"] }
hephaestus-ledger = { path = "../hephaestus-ledger" }
hephaestus-runtime = { path = "../hephaestus-runtime" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
hephaestus-core = { path = "../hephaestus-core" }
tempfile = "3"

[lints]
workspace = true
