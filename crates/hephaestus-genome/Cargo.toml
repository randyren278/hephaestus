[package]
name = "hephaestus-genome"
description = "Fail-closed Genome and World compilers for Hephaestus"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true
publish = false

[dependencies]
blake3 = "1"
hephaestus-core = { path = "../hephaestus-core" }
hephaestus-ledger = { path = "../hephaestus-ledger" }
serde = { version = "1", features = ["derive"] }
serde-saphyr = "1.1"
serde_json = "1"

[lints]
workspace = true

[dev-dependencies]
tempfile = "3"
