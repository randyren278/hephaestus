[package]
name = "hephaestus-arena"
description = "Deterministic, sealed evaluation for Hephaestus candidates"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true
publish = false

[dependencies]
hephaestus-experience = { path = "../hephaestus-experience" }
hephaestus-genome = { path = "../hephaestus-genome" }
hephaestus-ledger = { path = "../hephaestus-ledger" }
hephaestus-runtime = { path = "../hephaestus-runtime" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
hephaestus-core = { path = "../hephaestus-core" }
hephaestus-runtime = { path = "../hephaestus-runtime", features = ["test-support"] }
tempfile = "3"

[features]
test-support = []

[lints]
workspace = true
