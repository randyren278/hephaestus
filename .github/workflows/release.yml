name: Release

# Builds and publishes signed macOS release archives. Never runs on an
# ordinary push: only an explicit `v*` tag, or a manual dispatch for
# rehearsing the pipeline without publishing a GitHub Release.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
            target: aarch64-apple-darwin
          - arch: x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.target }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Report workspace version
        id: version
        run: |
          PACKAGE_VERSION=$(python3 -c "from pathlib import Path; from scripts.package_macos import workspace_version; print(workspace_version(Path('.')))")
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF" != "refs/tags/v$PACKAGE_VERSION" ]]; then
            echo "release tag must match workspace version v$PACKAGE_VERSION" >&2
            exit 1
          fi
          printf 'version=%s\n' "$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Require the native package architecture
        env:
          PACKAGE_ARCH: ${{ matrix.arch }}
        run: test "$(uname -m)" = "$PACKAGE_ARCH"

      - name: Build the ${{ matrix.arch }} archive
        run: python3 scripts/package_macos.py --arch ${{ matrix.arch }}

      - name: Accept the installed native archive before signing
        env:
          PACKAGE_ARCH: ${{ matrix.arch }}
          WORKSPACE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -o pipefail
          scripts/package_macos_acceptance.sh "target/packages/hephaestus-v${WORKSPACE_VERSION}-macos-${PACKAGE_ARCH}.tar.gz" 2>&1 | tee target/package-acceptance.log

      - name: Preserve native acceptance output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: package-acceptance-${{ matrix.arch }}
          path: target/package-acceptance.log
          if-no-files-found: ignore
          retention-days: 30

      - name: Checksum the archive
        working-directory: target/packages
        run: |
          for archive in *.tar.gz; do
            shasum -a 256 "$archive" > "$archive.sha256"
          done
          cat ./*.sha256

      - name: Upload release artifacts (${{ matrix.arch }})
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: hephaestus-${{ matrix.arch }}
          path: |
            target/packages/*.tar.gz
            target/packages/*.sha256
          if-no-files-found: error
          retention-days: 30

  sbom:
    name: Rust dependency inventory (${{ matrix.arch }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: aarch64-apple-darwin
          - arch: x86_64
            target: x86_64-apple-darwin
    steps:
      # The inventory generator never receives accepted package bytes or
      # signing permissions. Target suffixes keep both inventories distinct.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Install the pinned inventory generator
        run: cargo install cargo-cyclonedx --version 0.5.9 --locked

      - name: Generate the target-specific Rust inventory
        env:
          RUST_TARGET: ${{ matrix.target }}
        run: cargo cyclonedx --all --format json --describe binaries --spec-version 1.5 --target "$RUST_TARGET" --target-in-filename

      - name: Collect Rust inventories
        env:
          RUST_TARGET: ${{ matrix.target }}
        run: |
          python3 - <<'PY'
          import os
          import shutil
          from pathlib import Path
          from scripts.package_macos import BINARIES
          destination = Path('target/sbom')
          destination.mkdir(parents=True, exist_ok=True)
          for binary in BINARIES:
              matches = list(Path('crates').rglob(f"{binary}_bin_{os.environ['RUST_TARGET']}.cdx.json"))
              if len(matches) != 1:
                  raise SystemExit(f'expected one inventory for {binary}; found {len(matches)}')
              shutil.copy2(matches[0], destination / matches[0].name)
          PY

      - name: Upload Rust inventories (${{ matrix.arch }})
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: hephaestus-sbom-${{ matrix.arch }}
          path: target/sbom/*.cdx.json
          if-no-files-found: error
          retention-days: 30

  reproducibility:
    name: Reproducibility (build twice, compare)
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      # Same checkout, same toolchain, same absolute paths, two independent
      # builds. This is the honest scope of the reproducibility claim: it
      # proves the packaging pipeline (tar/gzip normalization, rustc output,
      # pinned Node download) is deterministic run-to-run on one machine. It
      # is not an independent third-party rebuild, which needs a second,
      # differently-provisioned builder and is not set up yet (see
      # docs/RELEASES.md).
      - name: Build once
        run: python3 scripts/package_macos.py --arch arm64 --output-dir target/packages/first

      - name: Build again from the same source
        run: python3 scripts/package_macos.py --arch arm64 --output-dir target/packages/second

      - name: Compare the two archives byte-for-byte
        run: |
          a=$(find target/packages/first -name '*.tar.gz')
          b=$(find target/packages/second -name '*.tar.gz')
          sha_a=$(shasum -a 256 "$a" | cut -d' ' -f1)
          sha_b=$(shasum -a 256 "$b" | cut -d' ' -f1)
          echo "first:  $sha_a  $a"
          echo "second: $sha_b  $b"
          if [[ "$sha_a" != "$sha_b" ]]; then
            echo "::error::archives are not byte-identical across two same-machine builds"
            exit 1
          fi
          echo "reproducible: identical SHA-256 across two independent builds"

  sign-and-attest:
    name: Sign and attest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build, sbom, reproducibility]
    runs-on: macos-15
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          pattern: hephaestus-*
          path: dist
          merge-multiple: true

      - name: List collected release artifacts
        run: ls -la dist

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Keyless-sign release files with Sigstore
        run: |
          for f in dist/*.tar.gz dist/*.sha256 dist/*.cdx.json; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done

      - name: Attest provenance for archives and Rust inventories
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.cdx.json

      - name: Upload verification bundles
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: hephaestus-signatures
          path: dist/*.sigstore.json
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build, reproducibility, sign-and-attest]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          pattern: hephaestus-*
          path: dist
          merge-multiple: true

      - name: Publish release with archives, checksums, SBOMs, and signatures
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* \
            --title "Hephaestus ${{ github.ref_name }}" \
            --generate-notes
