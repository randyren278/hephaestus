name: Release

# Builds and publishes signed macOS release archives. Never runs on an
# ordinary push: only an explicit `v*` tag, or a manual dispatch for
# rehearsing the pipeline without publishing a GitHub Release.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: macos-14
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Report workspace version
        id: version
        run: echo "version=$(python3 -c "import re; print(re.search(r'version = \"([^\"]+)\"', open('Cargo.toml').read()).group(1))")" >> "$GITHUB_OUTPUT"

      - name: Build the ${{ matrix.arch }} archive
        run: python3 scripts/package_macos.py --arch ${{ matrix.arch }}

      - name: Checksum the archive
        working-directory: target/packages
        run: |
          for archive in *.tar.gz; do
            shasum -a 256 "$archive" > "$archive.sha256"
          done
          cat ./*.sha256

      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --locked

      - name: Generate a CycloneDX SBOM for the Rust workspace
        run: cargo cyclonedx --all --format json --describe binaries

      - name: Collect SBOM output
        run: |
          mkdir -p target/packages/sbom
          find . -name '*.cdx.json' -not -path './target/*' -exec cp {} target/packages/sbom/ \;
          ls target/packages/sbom

      - name: Upload release artifacts (${{ matrix.arch }})
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: hephaestus-${{ matrix.arch }}
          path: |
            target/packages/*.tar.gz
            target/packages/*.sha256
            target/packages/sbom/*.cdx.json
          if-no-files-found: error
          retention-days: 30

  reproducibility:
    name: Reproducibility (build twice, compare)
    runs-on: macos-14
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      # Same checkout, same toolchain, same absolute paths, two independent
      # builds. This is the honest scope of the reproducibility claim: it
      # proves the packaging pipeline (tar/gzip normalization, rustc output,
      # pinned Node download) is deterministic run-to-run on one machine. It
      # is not an independent third-party rebuild, which needs a second,
      # differently-provisioned builder and is not set up yet (see
      # docs/RELEASES.md).
      - name: Build once
        run: python3 scripts/package_macos.py --arch arm64 --output-dir target/packages/first

      - name: Build again from the same source
        run: python3 scripts/package_macos.py --arch arm64 --output-dir target/packages/second

      - name: Compare the two archives byte-for-byte
        run: |
          a=$(find target/packages/first -name '*.tar.gz')
          b=$(find target/packages/second -name '*.tar.gz')
          sha_a=$(shasum -a 256 "$a" | cut -d' ' -f1)
          sha_b=$(shasum -a 256 "$b" | cut -d' ' -f1)
          echo "first:  $sha_a  $a"
          echo "second: $sha_b  $b"
          if [[ "$sha_a" != "$sha_b" ]]; then
            echo "::error::archives are not byte-identical across two same-machine builds"
            exit 1
          fi
          echo "reproducible: identical SHA-256 across two independent builds"

  sign-and-attest:
    name: Sign and attest
    needs: build
    runs-on: macos-14
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          pattern: hephaestus-*
          path: dist
          merge-multiple: true

      - name: List collected release artifacts
        run: ls -la dist

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Keyless-sign each archive and checksum with Sigstore
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          for f in dist/*.tar.gz dist/*.sha256; do
            cosign sign-blob --yes --output-signature "$f.sig" --output-certificate "$f.pem" "$f"
          done

      - name: Attest build provenance for the archives
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz

      - name: Upload signatures and certificates
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: hephaestus-signatures
          path: |
            dist/*.sig
            dist/*.pem
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, reproducibility, sign-and-attest]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          pattern: hephaestus-*
          path: dist
          merge-multiple: true

      - name: Publish release with archives, checksums, SBOMs, and signatures
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* \
            --title "Hephaestus ${{ github.ref_name }}" \
            --generate-notes
