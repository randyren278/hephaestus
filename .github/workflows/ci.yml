name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic:
    name: Tests, coverage, docs
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, llvm-tools-preview, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-hephaestus
          shared-key: ubuntu-stable-dependencies
          cache-bin: "false"
          save-if: "true"
          cache-on-failure: "true"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install coverage runner
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Lints
        run: cargo clippy --workspace --all-targets --all-features

      - name: Deterministic research statistics
        run: PYTHONPATH=python python -m unittest discover -s python/tests -v

      - name: Mutation source anchors
        run: python checks/target_gate.py --manifest checks/checks.json --root .

      - name: Offline Gauntlet fixture contracts
        run: python -m unittest discover -s scripts/tests -p 'test_gauntlet_reference.py' -v

      - name: macOS package builder and installer contracts
        run: python -m unittest discover -s scripts/tests -p 'test_macos_package.py' -v

      - name: Tests with coverage
        run: cargo llvm-cov --workspace --all-features --lcov --output-path lcov.info

      - name: Per-module floor for critical modules
        run: >-
          python checks/coverage_gate.py
          --manifest checks/checks.json --report lcov.info

      - name: Preserve Rust coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rust-lcov-${{ github.run_attempt }}
          path: lcov.info
          if-no-files-found: ignore
          retention-days: 7

      - name: Documentation gate
        run: |
          python checks/docs_gate.py --root . README.md AUDIT.md ROADMAP.md docs/*.md
          python checks/docs_gate.py --root . --skip-claims --min-diagrams 1 README.md docs/ARCHITECTURE.md

      # Only the mutation matrix uses these uninstrumented test artifacts.
      - name: Prepare mutation build dependencies
        run: cargo test --workspace --all-features --no-run

  tui:
    name: Ink TUI checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/hephaestus-tui
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build packaged TUI bundle
        run: npm run build:package

      - name: Tests
        run: npm test

  tui-pty:
    name: TUI live-daemon PTY
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-hephaestus
          shared-key: ubuntu-stable-dependencies
          cache-bin: "false"
          save-if: "false"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install locked TUI dependencies
        working-directory: apps/hephaestus-tui
        run: npm ci

      - name: PTY end-to-end tests against a live daemon
        env:
          HEPHAESTUS_TUI_PTY_E2E: "1"
        run: >-
          cargo test -p hephaestus-control --all-features --test control_plane_e2e
          -- --nocapture
          async_job_status_and_cancellation_remain_responsive_and_confirm_process_death
          tui_lineage_inspects_and_rolls_back_the_champion_through_a_pty

  mutation:
    name: Mutation guard (${{ matrix.scope }})
    needs: deterministic
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - scope: hephaestus-arena
            prefix: crates/hephaestus-arena/
            minimum: 63
            timeout_minutes: 20
          - scope: hephaestus-core
            prefix: crates/hephaestus-core/
            minimum: 9
            timeout_minutes: 20
          - scope: hephaestus-ledger
            prefix: crates/hephaestus-ledger/
            minimum: 10
            timeout_minutes: 20
          - scope: hephaestus-genome
            prefix: crates/hephaestus-genome/
            minimum: 31
            timeout_minutes: 20
          - scope: hephaestus-control-1
            prefix: crates/hephaestus-control/
            shard_index: 0
            shard_count: 5
            minimum: 14
            timeout_minutes: 30
          - scope: hephaestus-control-2
            prefix: crates/hephaestus-control/
            shard_index: 1
            shard_count: 5
            minimum: 14
            timeout_minutes: 30
          - scope: hephaestus-control-3
            prefix: crates/hephaestus-control/
            shard_index: 2
            shard_count: 5
            minimum: 14
            timeout_minutes: 30
          - scope: hephaestus-control-4
            prefix: crates/hephaestus-control/
            shard_index: 3
            shard_count: 5
            minimum: 14
            timeout_minutes: 30
          - scope: hephaestus-control-5
            prefix: crates/hephaestus-control/
            shard_index: 4
            shard_count: 5
            minimum: 14
            timeout_minutes: 30
          - scope: runtime-deterministic
            prefix: crates/hephaestus-runtime/src/deterministic.rs
            minimum: 5
            timeout_minutes: 30
          - scope: runtime-isolation
            prefix: crates/hephaestus-runtime/src/isolation.rs
            minimum: 3
            timeout_minutes: 30
          - scope: runtime-provider
            prefix: crates/hephaestus-runtime/src/provider.rs
            minimum: 2
            timeout_minutes: 30
          - scope: runtime-sandbox
            prefix: crates/hephaestus-runtime/src/sandbox.rs
            minimum: 10
            timeout_minutes: 30
          - scope: runtime-spec
            prefix: crates/hephaestus-runtime/src/spec.rs
            minimum: 6
            timeout_minutes: 30
          - scope: runtime-reference-instructions
            prefix: crates/hephaestus-runtime/src/reference_instruction.rs
            minimum: 6
            timeout_minutes: 30
          - scope: runtime-process-guardian
            prefix: crates/hephaestus-runtime/src/guardian.rs
            minimum: 1
            timeout_minutes: 30
          - scope: runtime-supervisor
            prefix: crates/hephaestus-runtime/src/supervisor.rs
            minimum: 11
            timeout_minutes: 30
          - scope: runtime-worker
            prefix: crates/hephaestus-runtime/src/worker.rs
            minimum: 5
            timeout_minutes: 30
          - scope: hephaestus-experience
            prefix: crates/hephaestus-experience/
            minimum: 71
            timeout_minutes: 20
          - scope: mutation-checks
            prefix: checks/
            minimum: 3
            timeout_minutes: 20
          - scope: python-statistics
            prefix: python/
            minimum: 8
            timeout_minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        if: matrix.scope != 'mutation-checks' && matrix.scope != 'python-statistics'

      - uses: Swatinem/rust-cache@v2
        if: matrix.scope != 'mutation-checks' && matrix.scope != 'python-statistics'
        with:
          prefix-key: v1-hephaestus
          shared-key: ubuntu-stable-dependencies
          cache-bin: "false"
          save-if: "false"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Break each invariant and require the suite to catch it
        run: >-
          python checks/mutation_guard.py
          --manifest checks/checks.json
          --file-prefix ${{ matrix.prefix }}
          --shard-index ${{ matrix.shard_index || 0 }}
          --shard-count ${{ matrix.shard_count || 1 }}
          --assert-min ${{ matrix.minimum }}
          --skip-baseline
