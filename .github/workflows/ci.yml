name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  msrv:
    name: Minimum Rust version (1.88)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.88.0"

      - name: Check all targets and features with the minimum compiler
        run: |
          RUSTC="$(rustup which --toolchain 1.88.0 rustc)" \
            "$(rustup which --toolchain 1.88.0 cargo)" check --locked --workspace --all-targets --all-features

  deterministic:
    name: Tests, coverage, docs
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy, llvm-tools-preview, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.8.1
        with:
          prefix-key: v1-hephaestus
          shared-key: ubuntu-stable-dependencies
          cache-bin: "false"
          save-if: "true"
          cache-on-failure: "true"

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with:
          python-version: "3.13"

      - name: Install coverage runner
        uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.62.15
        with:
          tool: cargo-llvm-cov

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Lints
        run: cargo clippy --workspace --all-targets --all-features

      - name: Lints (default features)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Deterministic research statistics
        run: PYTHONPATH=python python -m unittest discover -s python/tests -v

      - name: Mutation source anchors
        run: python checks/target_gate.py --manifest checks/checks.json --root .

      - name: Offline Gauntlet fixture contracts
        run: python -m unittest discover -s scripts/tests -p 'test_gauntlet_reference.py' -v

      - name: macOS package builder and installer contracts
        run: python -m unittest discover -s scripts/tests -p 'test_macos_package.py' -v

      - name: Source install contracts (Senate-only and full modes)
        run: python -m unittest discover -s scripts/tests -p 'test_source_install.py' -v

      - name: Docs icon and diagram generator contracts
        run: python -m unittest discover -s scripts/tests -p 'test_docs_art.py' -v

      - name: Tests with coverage
        # Two test threads: the control suite's Arena tests each spawn worker,
        # guardian, evaluator, and git processes, and four at once on this
        # runner add enough latency noise to trip the selection and canary
        # latency gates. Mutation shards keep the default (see TD-25).
        env:
          RUST_TEST_THREADS: "2"
        run: cargo llvm-cov --workspace --all-features --lcov --output-path lcov.info

      - name: Per-module floor for critical modules
        run: >-
          python checks/coverage_gate.py
          --manifest checks/checks.json --report lcov.info

      - name: Preserve Rust coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: rust-lcov-${{ github.run_attempt }}
          path: lcov.info
          if-no-files-found: ignore
          retention-days: 7

      - name: Documentation gate
        run: |
          python checks/docs_gate.py --root . README.md AUDIT.md docs/*.md

      # Only the mutation matrix uses these uninstrumented test artifacts.
      - name: Prepare mutation build dependencies
        run: cargo test --workspace --all-features --no-run

  macos-package:
    name: Native macOS package acceptance (arm64)
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: aarch64-apple-darwin

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Require native Apple Silicon
        run: test "$(uname -m)" = arm64

      - name: Build the archive
        run: python3 scripts/package_macos.py --arch arm64

      - name: Accept the installed archive
        run: |
          set -o pipefail
          scripts/package_macos_acceptance.sh target/packages/*.tar.gz 2>&1 | tee target/package-acceptance.log

      - name: Preserve acceptance output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: macos-package-acceptance
          path: target/package-acceptance.log
          if-no-files-found: ignore
          retention-days: 7

  supply-chain:
    name: Supply chain (cargo deny)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      - name: Licenses, advisories, banned/duplicate crates, and crate sources
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  tui:
    name: Ink TUI checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/hephaestus-tui
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Install locked dependencies
        run: npm ci

      - name: Audit locked dependencies (high and critical)
        run: npm audit --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Build packaged TUI bundle
        run: npm run build:package

      - name: Tests
        run: npm test

  web:
    name: Web console checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/hephaestus-web
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Install locked dependencies
        run: npm ci

      - name: Audit locked dependencies (high and critical)
        run: npm audit --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Build bundled server and console
        run: npm run build

      - name: Tests
        run: npm test

  tui-pty:
    name: TUI live-daemon PTY
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.8.1
        with:
          prefix-key: v1-hephaestus
          shared-key: ubuntu-stable-dependencies
          cache-bin: "false"
          save-if: "false"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Install locked TUI dependencies
        working-directory: apps/hephaestus-tui
        run: npm ci

      - name: Build the packaged TUI for terminal handoff checks
        working-directory: apps/hephaestus-tui
        run: npm run build:package

      - name: PTY end-to-end tests against a live daemon
        env:
          HEPHAESTUS_TUI_PTY_E2E: "1"
        run: >-
          cargo test -p hephaestus-control --all-features --test control_plane_e2e
          -- --nocapture
          async_job_status_and_cancellation_remain_responsive_and_confirm_process_death
          tui_lineage_inspects_and_rolls_back_the_champion_through_a_pty
          tui_evidence_screens_and_markdown_authoring_flow_through_a_pty
          tui_hosted_prompt_revision_recovers_and_assesses_through_a_pty
          tui_gene_bank_lists_and_inspects_an_extracted_gene_through_a_pty

  mutation:
    name: Mutation guard (${{ matrix.scope }})
    needs: deterministic
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - scope: hephaestus-arena
            prefix: crates/hephaestus-arena/
            minimum: 80
            timeout_minutes: 20
          - scope: hephaestus-core
            prefix: crates/hephaestus-core/
            minimum: 9
            timeout_minutes: 20
          - scope: hephaestus-ledger
            prefix: crates/hephaestus-ledger/
            minimum: 15
            timeout_minutes: 20
          - scope: hephaestus-genome
            prefix: crates/hephaestus-genome/
            minimum: 34
            timeout_minutes: 20
          - scope: hephaestus-control-1
            prefix: crates/hephaestus-control/
            shard_index: 0
            shard_count: 5
            minimum: 29
            timeout_minutes: 30
          - scope: hephaestus-control-2
            prefix: crates/hephaestus-control/
            shard_index: 1
            shard_count: 5
            minimum: 29
            timeout_minutes: 30
          - scope: hephaestus-control-3
            prefix: crates/hephaestus-control/
            shard_index: 2
            shard_count: 5
            minimum: 28
            timeout_minutes: 30
          - scope: hephaestus-control-4
            prefix: crates/hephaestus-control/
            shard_index: 3
            shard_count: 5
            minimum: 28
            timeout_minutes: 30
          - scope: hephaestus-control-5
            prefix: crates/hephaestus-control/
            shard_index: 4
            shard_count: 5
            minimum: 28
            timeout_minutes: 30
          - scope: runtime-deterministic
            prefix: crates/hephaestus-runtime/src/deterministic.rs
            minimum: 6
            timeout_minutes: 30
          - scope: runtime-isolation
            prefix: crates/hephaestus-runtime/src/isolation.rs
            minimum: 5
            timeout_minutes: 30
          - scope: runtime-provider
            prefix: crates/hephaestus-runtime/src/provider.rs
            minimum: 5
            timeout_minutes: 30
          - scope: runtime-sandbox
            prefix: crates/hephaestus-runtime/src/sandbox.rs
            minimum: 10
            timeout_minutes: 30
          - scope: runtime-spec
            prefix: crates/hephaestus-runtime/src/spec.rs
            minimum: 11
            timeout_minutes: 30
          - scope: runtime-reference-instructions
            prefix: crates/hephaestus-runtime/src/reference_instruction.rs
            minimum: 6
            timeout_minutes: 30
          - scope: runtime-process-guardian
            prefix: crates/hephaestus-runtime/src/guardian.rs
            minimum: 2
            timeout_minutes: 30
          - scope: runtime-supervisor
            prefix: crates/hephaestus-runtime/src/supervisor.rs
            minimum: 16
            timeout_minutes: 30
          - scope: runtime-provider-events
            prefix: crates/hephaestus-runtime/src/provider_events.rs
            minimum: 3
            timeout_minutes: 30
          - scope: runtime-worker
            prefix: crates/hephaestus-runtime/src/worker.rs
            minimum: 5
            timeout_minutes: 30
          - scope: hephaestus-experience
            prefix: crates/hephaestus-experience/
            minimum: 80
            timeout_minutes: 20
          - scope: mutation-checks
            prefix: checks/
            minimum: 5
            timeout_minutes: 20
          - scope: python-statistics
            prefix: python/
            minimum: 8
            timeout_minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        if: matrix.scope != 'mutation-checks' && matrix.scope != 'python-statistics'

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.8.1
        if: matrix.scope != 'mutation-checks' && matrix.scope != 'python-statistics'
        with:
          prefix-key: v1-hephaestus
          shared-key: ubuntu-stable-dependencies
          cache-bin: "false"
          save-if: "false"

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with:
          python-version: "3.13"

      - name: Build workspace binaries for tests that spawn them
        # Control and Arena tests spawn the reference worker, guardian, and
        # evaluator from target/debug. Without them a run fails for a reason
        # unrelated to the mutant, so the guard (run with --skip-baseline)
        # would score a "KILLED" that proves nothing and miss a real survivor
        # (control-candidate-process-not-supervised, TD-26).
        if: matrix.scope != 'mutation-checks' && matrix.scope != 'python-statistics'
        run: cargo build --workspace --bins --all-features

      - name: Break each invariant and require the suite to catch it
        # Swatinem/rust-cache sets CARGO_INCREMENTAL=0 for the whole workflow
        # (good for the main build, whose cache it saves once and never
        # touches again); a mutation shard instead recompiles the same crate
        # from a one-line source edit dozens of times in a row, so give this
        # step incremental compilation back to make each mutant's rebuild
        # reuse the previous mutant's object files instead of a full rebuild.
        env:
          CARGO_INCREMENTAL: "1"
        run: >-
          python checks/mutation_guard.py
          --manifest checks/checks.json
          --file-prefix ${{ matrix.prefix }}
          --shard-index ${{ matrix.shard_index || 0 }}
          --shard-count ${{ matrix.shard_count || 1 }}
          --assert-min ${{ matrix.minimum }}
          --skip-baseline
