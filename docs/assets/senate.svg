<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-labelledby="t d">
<title id="t">How the Senate debates a question</title>
<desc id="d">A semicircular chamber of senators around a clerk. You ask a question and pick a size from 3 to 15 senators. Every senator gives an opening view, the clerk drafts one answer, and each round senators vote agree, amend, or dissent and sharpen their views. When nobody dissents and most agree, the draft passes; otherwise the clerk redrafts, up to a round limit. You get one answer, the points of agreement, and any dissent credited to whoever raised it.</desc>
<rect width="960" height="520" rx="18" fill="#10131a"/>
<rect x="1" y="1" width="958" height="518" rx="17" fill="none" stroke="#3a3f4d"/>
