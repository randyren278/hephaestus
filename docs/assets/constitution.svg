<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="t d">
<title id="t">The eight Laws of Hephaestus</title>
<desc id="d">The eight Laws in plain English: 1. A released Genome can never change. 2. A child never gets more permissions than its parent. 3. Agents can&#x27;t touch the rules, the judge, the record, the budget, or the controls. 4. A model may recommend a promotion, but never perform one. 5. Every accepted change is recorded and can be replayed. 6. Results from different Worlds are never compared as if they were the same. 7. Freeze and kill always stay with the human operator. 8. Anything malformed or unsupported is refused.</desc>
<rect width="960" height="560" rx="18" fill="#10131a"/>
<rect x="1" y="1" width="958" height="558" rx="17" fill="none" stroke="#3a3f4d"/>
