<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 800" width="960" height="800" role="img" aria-labelledby="t d">
<title id="t">What is inside a Genome</title>
<desc id="d">A Genome bundles a name, parents, model, permissions, and prompt, sealed under one fingerprint. Permissions can only shrink from World to parent to child.</desc>
<rect width="960" height="800" rx="18" fill="#10131a"/>
<rect x="1" y="1" width="958" height="798" rx="17" fill="none" stroke="#3a3f4d"/>
<text x="40.0" y="60.0" text-anchor="start" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#e9e4d8">What&#x27;s inside a Genome</text>
<text x="40.0" y="90.0" text-anchor="start" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#a2a7b5">An agent&#x27;s recipe, sealed. Change one letter and it is a different Genome.</text>
<rect x="40.0" y="116.0" width="430.0" height="80.0" rx="12" fill="#1e2330" stroke="#3a3f4d" stroke-width="1"/>
<rect x="40" y="128" width="4" height="56" rx="2" fill="#f4c542"/>
<text x="60.0" y="143.0" text-anchor="start" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#e9e4d8">Name</text>
<text x="60.0" y="165.0" text-anchor="start" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#a2a7b5">A label for people. It is not part of the fingerprint&#x27;s</text>
<text x="60.0" y="184.6" text-anchor="start" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#a2a7b5">ancestry.</text>
<path d="M474.0 156.0 L560.0 335.0" fill="none" stroke="#3a3f4d" stroke-width="1.5" stroke-linejoin="round"/>
<rect x="40.0" y="206.0" width="430.0" height="80.0" rx="12" fill="#1e2330" stroke="#3a3f4d" stroke-width="1"/>
<rect x="40" y="218" width="4" height="56" rx="2" fill="#f4c542"/>
<text x="60.0" y="233.0" text-anchor="start" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#e9e4d8">Parents</text>
<text x="60.0" y="255.0" text-anchor="start" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#a2a7b5">The exact earlier Genomes this one came from, if any.</text>
<path d="M474.0 246.0 L560.0 335.0" fill="none" stroke="#3a3f4d" stroke-width="1.5" stroke-linejoin="round"/>
<rect x="40.0" y="296.0" width="430.0" height="80.0" rx="12" fill="#1e2330" stroke="#3a3f4d" stroke-width="1"/>
<rect x="40" y="308" width="4" height="56" rx="2" fill="#f4c542"/>
<text x="60.0" y="323.0" text-anchor="start" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#e9e4d8">Model</text>
<text x="60.0" y="345.0" text-anchor="start" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#a2a7b5">Which model runs it. Today only the built-in test model</text>
<text x="60.0" y="364.6" text-anchor="start" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#a2a7b5">executes.</text>
<path d="M474.0 336.0 L560.0 335.0" fill="none" stroke="#3a3f4d" stroke-width="1.5" stroke-linejoin="round"/>
<rect x="40.0" y="386.0" width="430.0" height="80.0" rx="12" fill="#1e2330" stroke="#3a3f4d" stroke-width="1"/>
<rect x="40" y="398" width="4" height="56" rx="2" fill="#f4c542"/>
<text x="60.0" y="413.0" text-anchor="start" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#e9e4d8">Permissions</text>
<text x="60.0" y="435.0" text-anchor="start" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#a2a7b5">May it write files? Use the network? Never more than</text>
<text x="60.0" y="454.6" text-anchor="start" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#a2a7b5">its parents.</text>
<path d="M474.0 426.0 L560.0 335.0" fill="none" stroke="#3a3f4d" stroke-width="1.5" stroke-linejoin="round"/>
<rect x="40.0" y="476.0" width="430.0" height="80.0" rx="12" fill="#1e2330" stroke="#3a3f4d" stroke-width="1"/>
<rect x="40" y="488" width="4" height="56" rx="2" fill="#f4c542"/>
<text x="60.0" y="503.0" text-anchor="start" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#e9e4d8">Prompt and files</text>
<text x="60.0" y="525.0" text-anchor="start" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#a2a7b5">The instructions, stored by fingerprint so nobody can</text>
<text x="60.0" y="544.6" text-anchor="start" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#a2a7b5">swap them.</text>
<path d="M474.0 516.0 L560.0 335.0" fill="none" stroke="#3a3f4d" stroke-width="1.5" stroke-linejoin="round"/>
<rect x="560.0" y="215.0" width="360.0" height="240.0" rx="12" fill="#1e2330" stroke="#e8590c" stroke-width="2"/>
<g transform="translate(700.00 235.00) scale(6.0000)" shape-rendering="crispEdges"><rect x="1" y="1" width="1.02" height="1.02" fill="#8a6a3a"/><rect x="2" y="1" width="1.02" height="1.02" fill="#8a6a3a"/><rect x="3" y="1" width="1.02" height="1.02" fill="#8a6a3a"/><rect x="4" y="1" width="1.02" height="1.02" fill="#8a6a3a"/><rect x="5" y="1" width="1.02" height="1.02" fill="#8a6a3a"/><rect x="6" y="1" width="1.02" height="1.02" fill="#8a6a3a"/><rect x="7" y="1" width="1.02" height="1.02" fill="#8a6a3a"/><rect x="8" y="1" width="1.02" height="1.02" fill="#8a6a3a"/><rect x="9" y="1" width="1.02" height="1.02" fill="#8a6a3a"/><rect x="10" y="1" width="1.02" height="1.02" fill="#8a6a3a"/><rect x="0" y="2" width="1.02" height="1.02" fill="#8a6a3a"/><rect x="1" y="2" width="1.02" height="1.02" fill="#e9e4d8"/><rect x="2" y="2" width="1.02" height="1.02" fill="#e9e4d8"/><rect x="3" y="2" width="1.02" height="1.02" fill="#e9e4d8"/><rect x="4" y="2" width="1.02" height="1.02" fill="#e9e4d8"/><rect x="5" y="2" width="1.02" height="1.02" fill="#e9e4d8"/><rect x="6" y="2" width="1.02" height="1.02" fill="#e9e4d8"/><rect x="7" y="2" width="1.02" height="1.02" fill="#e9e4d8"/><rect x="8" y="2" width="1.02" height="1.02" fill="#e9e4d8"/><rect x="9" y="2" width="1.02" height="1.02" fill="#e9e4d8"/><rect x="10" y="2" width="1.02" height="1.02" fill="#e9e4d8"/><rect x="11" y="2" width="1.02" height="1.02" fill="#8a6a3a"/><rect x="1" y="3" width="1.02" height="1.02" fill="#e9e4d8"/><rect x="2" y="3" width="1.02" height="1.02" fill="#a2a7b5"/><rect x="3" y="3" width="1.02" height="1.02" fill="#a2a7b5"/><rect x="4" y="3" width="1.02" height="1.02" fill="#a2a7b5"/><rect x="5" y="3" width="1.02" height="1.02" fill="#a2a7b5"/><rect x="6" y="3" width="1.02" height="1.02" fill="#a2a7b5"/><rect x="7" y="3" width="1.02" height="1.02" fill="#a2a7b5"/><rect x="8" y="3" width="1.02" height="1.02" fill="#a2a7b5"/><rect x="9" y="3" width="1.02" height="1.02" fill="#e9e4d8"/><rect x="1" y="4" width