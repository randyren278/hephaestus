<text x="740.0" y="339.0" text-anchor="middle" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#e9e4d8">One Genome</text>
<text x="740.0" y="365.0" text-anchor="middle" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#a2a7b5">the same recipe always gets</text>
<text x="740.0" y="385.3" text-anchor="middle" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#a2a7b5">the same fingerprint</text>
<rect x="580.0" y="407.0" width="320.0" height="32.0" rx="6" fill="#181c26" stroke="#3a3f4d" stroke-width="1"/>
<text x="740.0" y="428.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#f4c542">hephaestus:genome:&lt;fingerprint&gt;</text>
<text x="40.0" y="600.0" text-anchor="start" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#f4c542">Permissions only ever shrink</text>
<rect x="40.0" y="616.0" width="880.0" height="160.0" rx="12" fill="#181c26" stroke="#5b6270" stroke-width="1"/>
<text x="60.0" y="642.0" text-anchor="start" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#e9e4d8">World ceiling: the most any agent here may do</text>
<rect x="80.0" y="656.0" width="800.0" height="104.0" rx="12" fill="#1e2330" stroke="#5b6270" stroke-width="1"/>
<text x="100.0" y="682.0" text-anchor="start" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#e9e4d8">Parent: equal to or less than the World</text>
<rect x="120.0" y="696.0" width="720.0" height="50.0" rx="12" fill="#1e2330" stroke="#e8590c" stroke-width="2"/>
<text x="140.0" y="727.0" text-anchor="start" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#e9e4d8">Child: equal to or less than every parent. A child that asks for more is refused.</text>
</svg>
