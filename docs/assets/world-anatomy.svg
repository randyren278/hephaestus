<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" width="960" height="720" role="img" aria-labelledby="t d">
<title id="t">What is inside a World</title>
<desc id="d">A World bundles six parts: Laws: Rules no agent can change: no peeking at the judge, a cost cap. Permission ceiling: The most any agent here may do, such as writing files or using the network. What may change: Which parts the Forge may edit. Laws and the judge are never on the list. Promotion bar: How big and how certain a win must be before a new Champion is crowned. Goals: What counts as better, such as correctness. Tasks and judge: Visible tasks, sealed tasks, the judge program, and the key it trusts. Together they get one fingerprint. Results are comparable only when fingerprints match; changing any part makes a new World.</desc>
